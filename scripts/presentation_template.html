<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TestStand Sequenz-Präsentation</title>
<style>
/* ============================ THEME ============================ */
:root{
  --bg0:#070b16; --bg1:#0b1322; --bg2:#0e1828;
  --panel:rgba(255,255,255,.045);
  --panel-strong:rgba(255,255,255,.07);
  --pborder:rgba(255,255,255,.10);
  --pborder-soft:rgba(255,255,255,.06);
  --txt:#eaf0fb; --muted:#9fadc6; --faint:#6c7892;
  --line:rgba(160,180,220,.30);
  --brand:#3b82f6; --brand2:#22d3ee; --brand3:#8b5cf6;
  --ok:#34d399; --off:#5b6680;
  --shadow:0 18px 50px -22px rgba(0,0,0,.85);
  --r:16px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:var(--bg0);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  letter-spacing:.1px;
}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(1200px 700px at 12% -8%, rgba(59,130,246,.20), transparent 60%),
  radial-gradient(1100px 650px at 100% 0%, rgba(34,211,238,.16), transparent 55%),
  radial-gradient(1100px 800px at 80% 110%, rgba(139,92,246,.16), transparent 55%),
  linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
}
.bg::after{content:"";position:absolute;inset:-2px;
  background-image:
    radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);
  background-size:30px 30px;
  -webkit-mask-image:radial-gradient(1400px 900px at 50% 0%, #000, transparent 75%);
          mask-image:radial-gradient(1400px 900px at 50% 0%, #000, transparent 75%);
  opacity:.6;
}

/* ============================ HEADER ============================ */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:18px clamp(18px,4vw,46px);
  background:linear-gradient(180deg, rgba(8,12,22,.86), rgba(8,12,22,.55));
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--pborder-soft);
}
.brand{display:flex;align-items:center;gap:15px;min-width:0}
.mark{
  width:56px;height:56px;border-radius:13px;flex:none;overflow:hidden;background:#985b9c;
  box-shadow:0 12px 30px -8px rgba(152,91,156,.6), inset 0 0 0 1px rgba(255,255,255,.14);
}
.mark svg{display:block;width:100%;height:100%}
.brand-text h1{
  margin:0;font-size:clamp(30px,3.6vw,45px);font-weight:800;line-height:1.05;letter-spacing:.2px;
  background:linear-gradient(90deg,#fff, #ead9ff 55%, #a9ecf8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-text .zh{font-weight:800}
.brand-text p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.spacer{flex:1 1 auto}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--panel);border:1px solid var(--pborder);color:var(--muted);
  white-space:nowrap;
}
.chip b{color:var(--txt);font-weight:700}
.chip .led{width:8px;height:8px;border-radius:50%;background:var(--brand2);box-shadow:0 0 10px var(--brand2)}
.toggle{cursor:pointer;user-select:none;transition:.2s}
.toggle:hover{border-color:rgba(255,255,255,.22);color:var(--txt)}
.toggle .box{
  width:34px;height:19px;border-radius:999px;background:rgba(255,255,255,.12);
  position:relative;transition:.22s;flex:none;
}
.toggle .box::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on .box{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.toggle.on .box::after{left:17px}

/* ============================ LEGEND ============================ */
.legend{
  display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
  padding:13px clamp(18px,4vw,46px);
  border-bottom:1px solid var(--pborder-soft);
  background:rgba(255,255,255,.018);
}
.legend .lg-title{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-weight:700;margin-right:4px}
.lg{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.lg .sw{width:26px;height:20px;border-radius:7px;border:1px solid var(--cl);background:var(--ct);
  display:grid;place-items:center;color:var(--c)}
.lg .sw img{width:14px;height:14px;display:block}
.lg .dotline{width:14px;height:14px;border-radius:50%}

/* ============================ HINT ============================ */
.hint-banner{
  margin:20px clamp(18px,4vw,46px) -2px;
  padding:13px 18px;border-radius:13px;font-size:13.5px;color:#dbe7ff;font-weight:500;
  background:linear-gradient(90deg, rgba(59,130,246,.16), rgba(34,211,238,.10));
  border:1px solid rgba(99,179,237,.30);
  display:flex;align-items:center;gap:11px;
}
.hint-banner svg{width:20px;height:20px;flex:none;color:var(--brand2)}
.hint-banner kbd{background:rgba(255,255,255,.10);border:1px solid var(--pborder);border-radius:6px;padding:2px 7px;font:inherit;font-size:12px;font-weight:700}

/* ============================ OVERVIEW ============================ */
.stage{padding:22px clamp(14px,4vw,46px) 60px}
.overview{
  display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:nowrap;
  overflow-x:auto;padding:8px 4px 16px;scrollbar-width:thin;
}
.phase{
  flex:1 1 360px;min-width:360px;max-width:440px;
  background:var(--panel);border:1px solid var(--pborder);border-radius:20px;
  padding:0 0 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
}
.phase::before{content:"";position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,var(--pa),var(--pa2))}
.phase-main{flex:1.15 1 380px;min-width:380px;max-width:490px}
.phase-head{
  display:flex;align-items:center;gap:11px;padding:18px 20px 14px;
}
.phase-dot{width:11px;height:11px;border-radius:50%;background:var(--pa);box-shadow:0 0 14px var(--pa)}
.phase-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
.phase-head .phase-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);
  background:rgba(255,255,255,.06);border:1px solid var(--pborder-soft);padding:5px 10px;border-radius:999px}
.phase-blue{--pa:#38bdf8;--pa2:#3b82f6}
.phase-violet{--pa:#a78bfa;--pa2:#8b5cf6}
.phase-amber{--pa:#fbbf24;--pa2:#fb923c}
.phase-flow{padding:6px 20px 4px;display:flex;flex-direction:column;align-items:stretch}

.phasearrow{display:flex;align-items:center;justify-content:center;flex:0 0 30px;color:var(--line)}
.phasearrow svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(120,160,230,.25))}

/* ============================ NODE / CARD ============================ */
.node{
  --c:#94a3b8;--ct:rgba(148,163,184,.13);--cl:rgba(148,163,184,.4);
  position:relative;display:flex;align-items:center;gap:12px;
  width:100%;max-width:400px;margin:0 auto;
  padding:12px 13px;border-radius:14px;
  background:linear-gradient(180deg, var(--panel-strong), rgba(255,255,255,.02));
  border:1px solid var(--pborder);
  box-shadow:0 8px 22px -16px rgba(0,0,0,.9);
  transition:transform .16s ease, box-shadow .2s ease, border-color .2s ease, background .2s;
}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;
  background:var(--c);box-shadow:0 0 14px -2px var(--c)}
.node .num{
  flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid var(--pborder-soft);margin-left:3px;
}
.node .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--c);background:var(--ct);border:1px solid var(--cl)}
.node .ico img{width:20px;height:20px;display:block}
.node .ico svg{width:18px;height:18px}
.node .body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.node .label{font-size:14px;font-weight:650;line-height:1.25;color:var(--txt);overflow-wrap:anywhere}
.node .sub{font-size:11.5px;color:var(--muted);line-height:1.2;font-weight:500}
.node .tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  color:var(--c);background:var(--ct);border:1px solid var(--cl);padding:4px 8px;border-radius:7px;white-space:nowrap}
.node .status{flex:none;width:9px;height:9px;border-radius:50%;margin-left:2px}
.node .status.on{background:var(--ok);box-shadow:0 0 9px rgba(52,211,153,.8)}
.node .status.off{background:transparent;border:1.6px solid var(--off)}

/* clickable */
.node.clickable{cursor:pointer}
.node.clickable:hover{transform:translateY(-3px);border-color:var(--cl);
  box-shadow:0 16px 34px -18px var(--c), 0 0 0 1px var(--cl)}
.node.clickable::after{content:"";position:absolute;right:11px;top:50%;width:8px;height:8px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-50%) rotate(-45deg);opacity:0;transition:.2s;}
.node.clickable:hover::after{opacity:.9;right:9px}
.node .open-hint{position:absolute;right:13px;bottom:-9px;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--c);background:var(--bg1);border:1px solid var(--cl);
  padding:2px 7px;border-radius:7px;opacity:0;transform:translateY(-3px);transition:.2s;pointer-events:none}
.node.clickable:hover .open-hint{opacity:1;transform:none}

/* decision + end */
.node-dec{background:linear-gradient(180deg, rgba(244,114,182,.10), rgba(255,255,255,.02));border-color:rgba(244,114,182,.28)}
.node-dec .label{font-weight:750}
.node-end{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.04)}
.node-end .ico{width:24px;height:24px;border-radius:7px}.node-end .ico img{width:14px;height:14px}
.node-end .label{font-size:12.5px;color:var(--muted);font-weight:700}
.node-end .tag{display:none}.node-end::before{display:none}

/* dimming of disabled (toggled) */
body.dim .node.disabled{opacity:.5;filter:grayscale(.55)}
body.dim .node.disabled::before{box-shadow:none}

/* pulse hint on first clickable */
.node.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.0)}50%{box-shadow:0 0 0 6px rgba(34,211,238,.16)}}

/* ============================ CONNECTOR ============================ */
.conn{display:flex;justify-content:center;color:var(--line);height:30px}
.conn svg{width:16px;height:30px}

/* ============================ LOOP ============================ */
.loop{position:relative;width:100%;max-width:400px;margin:0 auto;
  border:1.5px dashed rgba(192,132,252,.45);border-radius:16px;
  background:rgba(192,132,252,.05);padding:10px 12px 12px;}
.loop-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.loop-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:#d8b4fe;background:rgba(192,132,252,.16);border:1px solid rgba(192,132,252,.4);
  padding:3px 9px;border-radius:999px}
.loop-badge img{width:13px;height:13px;display:block}
.loop-label{font-size:12px;color:var(--muted);font-weight:600}
.loop-body{display:flex;flex-direction:column;align-items:center}
.loop-foot{display:flex;justify-content:center;margin-top:8px}
.retry{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#d8b4fe;
  background:rgba(192,132,252,.10);border:1px dashed rgba(192,132,252,.4);padding:3px 10px;border-radius:999px}

/* ============================ BRANCH (detail fork) ============================ */
.branch{display:flex;flex-direction:column;align-items:center;width:100%}
.fork{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);
  gap:22px;align-items:stretch;width:100%;padding:30px 0}
.fork::before{content:"";position:absolute;top:0;left:50%;width:2px;height:16px;background:var(--line);transform:translateX(-50%)}
.fork::after{content:"";position:absolute;bottom:0;left:50%;width:2px;height:16px;background:var(--line);transform:translateX(-50%)}
.fork-railtop,.fork-railbot{position:absolute;height:2px;background:var(--line)}
.fork-railtop{top:16px}.fork-railbot{bottom:16px}
.lane{position:relative;display:flex;flex-direction:column;align-items:center;
  border:1px solid var(--pborder-soft);border-radius:15px;background:rgba(255,255,255,.025);padding:14px 12px}
.lane::before,.lane::after{content:"";position:absolute;left:50%;width:2px;height:14px;background:var(--line);transform:translateX(-50%)}
.lane::before{top:-14px}.lane::after{bottom:-14px}
.lane-label{display:inline-block;font-size:11.5px;font-weight:800;color:#dbe7ff;letter-spacing:.3px;
  background:rgba(99,179,237,.14);border:1px solid rgba(99,179,237,.32);padding:4px 11px;border-radius:999px;margin-bottom:4px}
.lane-body{display:flex;flex-direction:column;align-items:center;width:100%}
.lane-body .node{padding-right:11px}
.lane-body .node .tag{display:none}      /* lanes are space-constrained: icon+colour already convey the type */
.lane-skip{font-size:12px;color:var(--faint);font-style:italic;padding:8px}

/* ============================ BRANCH (overview stacked) ============================ */
.obranch{display:flex;flex-direction:column;align-items:stretch;width:100%}
.opath-wrap{display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px dashed var(--line);margin:0 0 0 16px}
.opath{display:flex;flex-direction:column;gap:6px}
.opath-tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.3px;color:#dbe7ff;
  background:rgba(99,179,237,.14);border:1px solid rgba(99,179,237,.32);padding:3px 10px;border-radius:999px}
.opath-body{display:flex;flex-direction:column;align-items:stretch}
.skip{font-size:12px;color:var(--faint);font-style:italic;padding:4px 2px}

/* ============================ OVERLAY / SHEET ============================ */
.overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:clamp(12px,3vw,40px)}
.overlay[hidden]{display:none}
.overlay-bg{position:absolute;inset:0;background:rgba(4,7,14,.66);backdrop-filter:blur(6px);
  animation:fade .25s ease}
.sheet{position:relative;width:min(880px,100%);max-height:90vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));
  border:1px solid var(--pborder);border-radius:22px;overflow:hidden;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03);
  animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;
  border-bottom:1px solid var(--pborder-soft);
  background:linear-gradient(180deg, rgba(59,130,246,.10), transparent)}
.sheet-title{flex:1;min-width:0}
.bread{font-size:11.5px;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.bread b{color:var(--muted)}
.sheet-title h2{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px;
  font-family:"Cascadia Code",ui-monospace,"Consolas",monospace;color:#eaf2ff}
.sheet-sub{margin:4px 0 0;color:var(--muted);font-size:13.5px;font-weight:500}
.sheet-badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:800;letter-spacing:.3px;padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge.sub{color:#c7d6ff;background:rgba(99,179,237,.14);border:1px solid rgba(99,179,237,.34)}
.badge.ext{color:#a7f3e8;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.36)}
.badge.on{color:#bdf2d4;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.36)}
.badge.off{color:#c2cad9;background:rgba(91,102,128,.18);border:1px solid rgba(91,102,128,.4)}
.icobtn{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--pborder);
  background:rgba(255,255,255,.05);color:var(--muted);font-size:20px;cursor:pointer;display:grid;place-items:center;
  transition:.18s;line-height:1}
.icobtn:hover{color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.10)}
.back{width:auto;padding:0 14px;font-size:13px;font-weight:700;gap:6px}
.sheet-body{overflow:auto;padding:26px 22px 30px;scrollbar-width:thin}
.flow{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.flow>*{animation:rise .4s ease both}
.flow>*:nth-child(1){animation-delay:.02s}.flow>*:nth-child(2){animation-delay:.06s}
.flow>*:nth-child(3){animation-delay:.10s}.flow>*:nth-child(4){animation-delay:.14s}
.flow>*:nth-child(5){animation-delay:.18s}.flow>*:nth-child(6){animation-delay:.22s}
.flow>*:nth-child(7){animation-delay:.26s}.flow>*:nth-child(n+8){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============================ FOOTER ============================ */
.foot{padding:0 clamp(18px,4vw,46px) 34px;color:var(--faint);font-size:12px;text-align:center}
.foot b{color:var(--muted)}

/* ============================ ATTRACT / AUTO-DEMO ============================ */
#attractBadge{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:250;
  opacity:0;pointer-events:none;transition:opacity .45s ease, transform .45s ease;
  display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;
  background:rgba(59,130,246,.22);border:1px solid rgba(59,130,246,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#e6f0ff;font-size:13.5px;font-weight:600;letter-spacing:.2px;
  box-shadow:0 16px 44px -14px rgba(0,0,0,.8)}
body.attract #attractBadge{opacity:1;transform:translate(-50%,0)}
#attractBadge .pl{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b82f6,#22d3ee);animation:pl 1.8s ease-out infinite}
#attractBadge .pl svg{width:11px;height:11px;color:#fff;margin-left:1px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}70%,100%{box-shadow:0 0 0 13px rgba(59,130,246,0)}}

/* ============================ COMPARE (Flowchart + SeqEdit) ============================ */
.codebtn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:11.5px;font-weight:700;letter-spacing:.2px;color:#cdd8ee;
  background:rgba(255,255,255,.05);border:1px solid var(--pborder);border-radius:9px;
  padding:6px 11px;transition:transform .16s ease, background .2s, border-color .2s, color .2s;white-space:nowrap}
.codebtn:hover{color:#fff;border-color:rgba(99,179,237,.5);background:rgba(99,179,237,.14);transform:translateY(-1px)}
.codebtn svg{width:14px;height:14px;color:var(--brand2)}
.phase-head .codebtn{margin-left:8px}
.sheet-head .codebtn{align-self:center;flex:none}

#compareModal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:clamp(10px,2.4vw,38px)}
#compareModal[hidden]{display:none}
.cmp-bg{position:absolute;inset:0;background:rgba(3,6,12,.8);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fade .22s ease}
.cmp-win{position:relative;z-index:1;width:min(1400px,96vw);max-height:92vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--pborder);border-radius:18px;overflow:hidden;
  box-shadow:0 44px 120px -30px rgba(0,0,0,.95);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.cmp-bar{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--pborder-soft);background:linear-gradient(180deg, rgba(59,130,246,.10), transparent)}
.cmp-bar .t{flex:1;min-width:0}
.cmp-bar h2{margin:0;font-size:19px;font-weight:800;font-family:"Cascadia Code",ui-monospace,Consolas,monospace;color:#eaf2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-bar p{margin:3px 0 0;color:var(--muted);font-size:12.5px;font-weight:500}
.cmp-close{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--pborder);background:rgba(255,255,255,.05);color:var(--muted);font-size:20px;cursor:pointer;display:grid;place-items:center;line-height:1;transition:.18s}
.cmp-close:hover{color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1)}
.cmp-body{display:flex;min-height:0;flex:1}
.cmp-pane{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;min-height:0}
.cmp-pane+.cmp-pane{border-left:1px solid var(--pborder-soft)}
.cmp-phead{display:flex;align-items:center;gap:9px;padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.025);border-bottom:1px solid var(--pborder-soft)}
.cmp-phead .dots{display:flex;gap:5px}
.cmp-phead .dots i{width:9px;height:9px;border-radius:50%;display:block}
.cmp-phead .dots i:nth-child(1){background:#ff5f57}.cmp-phead .dots i:nth-child(2){background:#febc2e}.cmp-phead .dots i:nth-child(3){background:#28c840}
.cmp-phead svg{width:14px;height:14px;color:var(--brand2)}
.cmp-scroll{overflow:auto;padding:20px 16px;flex:1;min-height:0;scrollbar-width:thin}
.cmp-scroll.flowpane{display:flex;flex-direction:column;align-items:center}
.cmp-scroll .node{pointer-events:none}
.cmp-scroll .open-hint{display:none}
.cmp-scroll .node.clickable::after{display:none}
.cmp-scroll img.shot{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px;border:1px solid var(--pborder-soft);background:#fff;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.cmp-codecap{padding:9px 16px;border-top:1px solid var(--pborder-soft);color:var(--faint);font-size:11px;text-align:center}

/* rendered step-listing fallback (when no SeqEdit screenshot) */
.listing{display:flex;flex-direction:column;gap:3px;font-family:"Cascadia Code",ui-monospace,Consolas,monospace}
.listing .lgroup{margin:10px 0 3px;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.lrow{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--pborder-soft)}
.lrow:hover{background:rgba(255,255,255,.05)}
.lrow .li-ico{flex:none;width:20px;height:20px;display:grid;place-items:center}
.lrow .li-ico img{width:16px;height:16px;display:block}
.lrow .li-name{flex:1;min-width:0;font-size:12.5px;color:var(--txt);overflow-wrap:anywhere}
.lrow .li-type{flex:none;font-size:10px;color:var(--faint);font-weight:700}
.lrow.dis .li-name{text-decoration:line-through;color:var(--faint)}
.fallback-note{margin:2px 0 12px;font-size:11.5px;color:var(--faint);text-align:center;font-style:italic}

::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:content-box}

/* ============================ RESPONSIVE ============================ */
@media(max-width:1080px){
  .overview{flex-direction:column;align-items:center;overflow:visible}
  .phase,.phase-main{max-width:560px;width:100%}
  .phasearrow{transform:rotate(90deg)}
}
@media(max-width:880px){
  .cmp-body{flex-direction:column;overflow:auto}
  .cmp-pane+.cmp-pane{border-left:none;border-top:1px solid var(--pborder-soft)}
  .cmp-scroll{overflow:visible}
}
@media(max-width:560px){
  .node .tag{display:none}
  .top{gap:12px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

const TYPE = DATA.types;      // kind -> {c, tag}
const ICONS = DATA.icons;     // itype -> dataURI
const SUBS = DATA.subs;
const MAIN = DATA.main;
const SHOTS = DATA.shots;     // sequence name -> dataURI | null
const LISTING = DATA.listing; // key -> [rows]
const L = LBL;

function iconImg(itype, cls){
  const src = ICONS[itype] || ICONS['__default__'];
  return src ? `<img class="${cls||''}" src="${src}" alt="">` : '';
}
const conn = () => `<div class="conn">${ARROW}</div>`;

/* ============================ NODE RENDER ============================ */
function nodeHTML(n, variant){
  const meta = TYPE[n.kind] || TYPE.stmt;
  const c = meta.c;
  const clickable = !!(n.target && SUBS[n.target]);
  const dis = (variant==='overview') && (n.enabled===false);
  const cls = ['node','t-'+n.kind];
  if(n.kind==='dec') cls.push('node-dec');
  if(n.kind==='end') cls.push('node-end');
  if(clickable) cls.push('clickable');
  if(dis) cls.push('disabled');
  const style = `--c:${c};--ct:${c}20;--cl:${c}66`;
  const attr = clickable ? ` data-open="${esc(n.target)}" role="button" tabindex="0" title="${esc(L.openSub)}"` : '';
  const num = (variant==='overview' && n.num) ? `<span class="num">${esc(n.num)}</span>` : '';
  const status = (variant==='overview' && n.kind!=='end' && n.kind!=='dec')
        ? `<span class="status ${n.enabled===false?'off':'on'}" title="${n.enabled===false?esc(L.inactive):esc(L.active)}"></span>` : '';
  const tag = (n.kind==='end') ? '' : `<span class="tag">${esc(n.ext ? L.externalSeq : meta.tag)}</span>`;
  const hint = clickable ? `<span class="open-hint">${LAYERS} ${esc(L.open)}</span>` : '';
  return `<div class="${cls.join(' ')}" style="${style}"${attr}>
      ${num}<span class="ico">${iconImg(n.itype)}</span>
      <span class="body"><span class="label">${esc(n.label)}</span>${n.sub?`<span class="sub">${esc(n.sub)}</span>`:''}</span>
      ${status}${tag}${hint}
    </div>`;
}

function loopHTML(b, variant){
  const label = (b.label||'') + (b.cond ? ' · '+b.cond : '');
  return `<div class="loop">
    <div class="loop-head"><span class="loop-badge">${iconImg(b.itype)}${esc(L.loop)}</span><span class="loop-label">${esc(label)}</span></div>
    <div class="loop-body">${renderBlocks(b.blocks,variant)}</div>
    <div class="loop-foot"><span class="retry">↺ ${esc(L.retry)}</span></div>
  </div>`;
}

function forkHTML(b, variant){
  const N = Math.max(1,b.paths.length), rail = (0.5/N*100).toFixed(2);
  const lanes = b.paths.map(p=>`<div class="lane">
      <span class="lane-label">${esc(p.label)}</span>
      <div class="lane-body">${ p.blocks.length ? renderBlocks(p.blocks,variant) : '<span class="lane-skip">'+esc(L.skipped)+'</span>'}</div>
    </div>`).join('');
  return `<div class="branch">
    ${nodeHTML(b.dec,variant)}
    <div class="fork">
      <span class="fork-railtop" style="left:${rail}%;right:${rail}%"></span>
      ${lanes}
      <span class="fork-railbot" style="left:${rail}%;right:${rail}%"></span>
    </div>
    ${b.merge ? nodeHTML(b.merge,variant) : ''}
  </div>`;
}

function obranchHTML(b){
  const paths = b.paths.map(p=>`<div class="opath">
      <span class="opath-tag">${esc(p.label)}</span>
      <div class="opath-body">${ p.blocks.length ? renderBlocks(p.blocks,'overview') : '<span class="skip">'+esc(L.skipped)+'</span>'}</div>
    </div>`).join('');
  return `<div class="obranch">
    ${nodeHTML(b.dec,'overview')}${conn()}
    <div class="opath-wrap">${paths}</div>${conn()}
    ${b.merge ? nodeHTML(b.merge,'overview') : ''}
  </div>`;
}

function renderBlock(b, variant){
  if(b.type==='node')   return nodeHTML(b.node,variant);
  if(b.type==='loop')   return loopHTML(b,variant);
  if(b.type==='branch') return (variant==='overview') ? obranchHTML(b) : forkHTML(b,variant);
  return '';
}
function renderBlocks(blocks, variant){
  return blocks.map((b,i)=> (i>0?conn():'') + renderBlock(b,variant)).join('');
}

/* number the top-level nodes of an overview phase */
function numberTop(blocks){
  let k=0;
  blocks.forEach(b=>{
    if(b.type==='node'){ if(b.node.kind!=='end'){ k++; b.node.num=String(k); } }
    else if(b.type==='loop'){ /* loops are unnumbered containers */ }
    else if(b.type==='branch'){ if(b.dec){ k++; b.dec.num=String(k); } }
  });
}
function countSteps(blocks){
  let c=0;
  blocks.forEach(b=>{
    if(b.type==='node'){ if(b.node.kind!=='end') c++; }
    else if(b.type==='loop'){ c+=countSteps(b.blocks); }
    else if(b.type==='branch'){ if(b.dec)c++; b.paths.forEach(p=>c+=countSteps(p.blocks)); }
  });
  return c;
}

/* ============================ OVERVIEW ============================ */
function renderOverview(){
  const parts = MAIN.map(ph=>{
    numberTop(ph.blocks);
    return `<section class="phase phase-${ph.accent}${ph.name===MAIN[1]?.name?' phase-main':''}">
      <div class="phase-head">
        <span class="phase-dot"></span><h2>${esc(ph.title||ph.name)}</h2>
        <span class="phase-count">${countSteps(ph.blocks)} ${esc(L.stepsShort)}</span>
        <button class="codebtn" data-cmp="phase:${esc(ph.name)}" title="${esc(L.compareTitle)}">${MONITOR}${esc(L.code)}</button>
      </div>
      <div class="phase-flow">${ ph.blocks.length ? renderBlocks(ph.blocks,'overview') : '<span class="skip">'+esc(L.emptyGroup)+'</span>'}</div>
    </section>`;
  });
  document.getElementById('overview').innerHTML =
    parts.join(`<div class="phasearrow">${PHARROW}</div>`);
  const first = document.querySelector('#overview .node.clickable');
  if(first) first.classList.add('pulse');
}

/* ============================ LEGEND ============================ */
function renderLegend(){
  document.getElementById('legendTitle').textContent = L.legend;
  let h = (DATA.legend||[]).map(([kind,itype,label])=>{
    const c = (TYPE[kind]||TYPE.stmt).c;
    return `<span class="lg"><span class="sw" style="--c:${c};--ct:${c}20;--cl:${c}66">${iconImg(itype)}</span>${esc(label)}</span>`;
  }).join('');
  h += `<span class="lg"><span class="dotline" style="background:var(--ok);box-shadow:0 0 9px rgba(52,211,153,.8)"></span>${esc(L.active)}</span>`;
  h += `<span class="lg"><span class="dotline" style="border:1.6px solid var(--off)"></span>${esc(L.inactive)}</span>`;
  document.getElementById('legend').insertAdjacentHTML('beforeend',h);
}

/* ============================ DETAIL OVERLAY ============================ */
const overlay = document.getElementById('overlay');
const stack = [];
function openDetail(key){
  const sub = SUBS[key]; if(!sub) return;
  stack.push(key); renderDetail();
  overlay.hidden = false; document.body.style.overflow='hidden';
  document.querySelector('#overview .node.pulse')?.classList.remove('pulse');
}
function renderDetail(){
  const key = stack[stack.length-1];
  const sub = SUBS[key];
  document.getElementById('sheetTitle').textContent = sub.title;
  document.getElementById('sheetSub').textContent  = sub.subtitle||'';
  const crumbs = ['<b>'+esc(L.mainSeqCrumb)+' '+esc(DATA.meta.mainSeq)+'</b>', ...stack.map(k=>esc(SUBS[k].title))];
  document.getElementById('bread').innerHTML = crumbs.join(' › ');
  const badges = [];
  badges.push(sub.external ? '<span class="badge ext">'+esc(L.externalFile)+'</span>' : '<span class="badge sub">'+esc(L.subsequence)+'</span>');
  badges.push(sub.enabled===false ? '<span class="badge off">◦ '+esc(L.inactive)+'</span>' : '<span class="badge on">● '+esc(L.active)+'</span>');
  document.getElementById('sheetBadges').innerHTML = badges.join('');
  const body = document.getElementById('sheetBody');
  body.innerHTML = sub.body.length ? renderBlocks(sub.body,'detail') : '<span class="skip">'+esc(L.emptyGroup)+'</span>';
  body.parentElement.scrollTop = 0;
  document.getElementById('backBtn').hidden = stack.length<2;
  const cb=document.getElementById('cmpBtn'); cb.dataset.cmp='sub:'+key; cb.hidden=false;
}
function closeDetail(){ stack.length=0; overlay.hidden=true; document.body.style.overflow=''; }
function back(){ if(stack.length>1){ stack.pop(); renderDetail(); } else closeDetail(); }

document.addEventListener('click', e=>{
  const open = e.target.closest('[data-open]');
  if(open){ openDetail(open.getAttribute('data-open')); return; }
  if(e.target.closest('[data-close]')) closeDetail();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !overlay.hidden) back();
  const open = e.target.closest && e.target.closest('[data-open]');
  if(open && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDetail(open.getAttribute('data-open')); }
});
document.getElementById('backBtn').addEventListener('click', back);

/* ============================ COMPARE (flowchart + screenshot / listing) ============================ */
const cmpModal=document.getElementById('compareModal');
function listingHTML(key){
  const rows = LISTING[key] || [];
  if(!rows.length) return '<div class="shot-missing">'+esc(L.noSteps)+'</div>';
  let out=(L.fallbackNote?'<div class="fallback-note">'+esc(L.fallbackNote)+'</div>':'')+'<div class="listing">';
  rows.forEach(r=>{
    if(r.group){ out+='<div class="lgroup">'+esc(r.group)+'</div>'; return; }
    const pad = 'margin-left:'+(r.depth*18)+'px';
    out+=`<div class="lrow${r.dis?' dis':''}" style="${pad}"><span class="li-ico">${iconImg(r.icon)}</span><span class="li-name">${esc(r.name)}</span><span class="li-type">${esc(r.tdisp||'')}</span></div>`;
  });
  return out+'</div>';
}
function openCompare(kind,id){
  let title, sub, blocks, variant, shotKey, listKey;
  if(kind==='phase'){
    const ph=MAIN.find(p=>p.name===id); if(!ph) return;
    title=ph.title||ph.name; sub=esc(L.phase)+' · '+esc(L.compareSub);
    blocks=ph.blocks; variant='overview';
    shotKey=DATA.meta.mainSeq; listKey='phase:'+id;
  } else {
    const s=SUBS[id]; if(!s) return;
    title=s.title; sub=(s.external?esc(L.externalSeq):esc(L.subsequence))+' · '+esc(L.compareSub);
    blocks=s.body; variant='detail';
    shotKey=id; listKey=id;
  }
  document.getElementById('cmpTitle').textContent=title;
  document.getElementById('cmpSub').textContent=sub;
  const flow=document.getElementById('cmpFlow');
  flow.innerHTML = blocks.length ? renderBlocks(blocks,variant) : '<span class="skip">'+esc(L.emptyGroup)+'</span>';
  flow.scrollTop=0;
  const code=document.getElementById('cmpCode');
  const shot = SHOTS[shotKey];
  if(shot){
    code.innerHTML='<img class="shot" alt="'+esc(title)+'" src="'+shot+'">';
    document.getElementById('cmpCodeCap').textContent = L.capScreenshot;
  } else {
    code.innerHTML=listingHTML(listKey);
    document.getElementById('cmpCodeCap').textContent = L.capFallback;
  }
  code.scrollTop=0;
  cmpModal.hidden=false;
}
function closeCompare(){ cmpModal.hidden=true; }
cmpModal.addEventListener('click', e=>{ if(e.target.closest('[data-close-cmp]')) closeCompare(); });
document.addEventListener('click', e=>{ const b=e.target.closest('[data-cmp]'); if(b&&b.dataset.cmp){ const i=b.dataset.cmp.indexOf(':'); openCompare(b.dataset.cmp.slice(0,i), b.dataset.cmp.slice(i+1)); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !cmpModal.hidden){ e.stopImmediatePropagation(); closeCompare(); } }, true);

/* dim toggle */
const dimToggle = document.getElementById('dimToggle');
function setDim(on){ document.body.classList.toggle('dim', on); dimToggle.classList.toggle('on', on); dimToggle.setAttribute('aria-checked', on); }
setDim(false);
dimToggle.addEventListener('click', ()=> setDim(!document.body.classList.contains('dim')));
dimToggle.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); dimToggle.click(); } });

/* ============================ ATTRACT / AUTO-DEMO ============================ */
const IDLE_MS=20000, SHOW_MS=4500, GAP_MS=900, SUPPRESS_MS=600;
const autoToggle=document.getElementById('autoToggle');
let autoOff=false, attractOn=false, attractI=0, idleTimer=null, attractTimers=[], suppressUntil=0, lastX=null, lastY=null;
const nowt=()=>performance.now();
const suppress=ms=>{ suppressUntil=nowt()+ms; };
const suppressed=()=>nowt()<suppressUntil;

const ATTRACT=(()=>{ const seen=new Set(), list=[];
  const add=t=>{ if(t&&SUBS[t]&&!SUBS[t].external&&!seen.has(t)){ seen.add(t); list.push(t); } };
  const walk=bs=>bs.forEach(b=>{
    if(b.type==='node') add(b.node.target);
    else if(b.type==='loop') walk(b.blocks);
    else if(b.type==='branch'){ add(b.dec.target); b.paths.forEach(p=>walk(p.blocks)); if(b.merge) add(b.merge.target); }
  });
  MAIN.forEach(ph=>walk(ph.blocks)); return list;
})();
function attractPlaylist(){
  const list=[];
  MAIN.forEach(ph=>{ list.push({kind:'phase',id:ph.name}); });
  ATTRACT.forEach(k=>list.push({kind:'sub',id:k}));
  return list;
}
function schedule(fn,ms){ const id=setTimeout(fn,ms); attractTimers.push(id); return id; }
function clearSchedule(){ attractTimers.forEach(clearTimeout); attractTimers=[]; }
function startAttract(){ if(attractOn||autoOff) return; attractOn=true; attractI=0; document.body.classList.add('attract'); attractStep(); }
function attractStep(){
  if(!attractOn) return;
  const pl=attractPlaylist(); if(!pl.length){ stopAttract(); return; }
  const t=pl[attractI%pl.length];
  suppress(SUPPRESS_MS); openCompare(t.kind, t.id);
  schedule(()=>{ if(!attractOn) return; suppress(SUPPRESS_MS); closeCompare(); attractI++; schedule(()=>{ if(attractOn) attractStep(); }, GAP_MS); }, SHOW_MS);
}
function stopAttract(){ if(!attractOn) return; attractOn=false; clearSchedule(); document.body.classList.remove('attract'); closeCompare(); closeDetail(); }
function activity(){ if(suppressed()) return; if(attractOn) stopAttract(); clearTimeout(idleTimer); if(!autoOff) idleTimer=setTimeout(startAttract, IDLE_MS); }
function onMove(e){ if(lastX!==null && e.clientX===lastX && e.clientY===lastY) return; lastX=e.clientX; lastY=e.clientY; activity(); }
['mousedown','keydown','wheel','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev, activity, {passive:true}));
document.addEventListener('mousemove', onMove, {passive:true});
function setAuto(on){ autoOff=!on; autoToggle.classList.toggle('on', on); autoToggle.setAttribute('aria-checked', on); if(!on){ stopAttract(); clearTimeout(idleTimer); } else activity(); }
autoToggle.addEventListener('click', ()=> setAuto(autoOff));
autoToggle.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setAuto(autoOff); } });

/* ============================ STATIC TEXT ============================ */
function fillText(){
  document.title = 'TestStand: ' + DATA.meta.title;
  document.getElementById('hTitle').innerHTML = 'TestStand:&nbsp;<span class="zh">'+esc(DATA.meta.title)+'</span>';
  document.getElementById('hSub').textContent = L.headerSub;
  document.getElementById('chipSeqLabel').textContent = L.chipSequence;
  document.getElementById('chipSeq').textContent = DATA.meta.mainSeq;
  document.getElementById('chipSrcLabel').textContent = L.chipSource;
  document.getElementById('chipSrc').textContent = DATA.meta.source;
  document.getElementById('dimLabel').textContent = L.hideDisabled;
  document.getElementById('autoLabel').textContent = L.autoDemo;
  document.getElementById('backBtn').textContent = '← '+L.back;
  document.getElementById('cmpBtnLabel').textContent = L.codeAndFlow;
  document.getElementById('attractText').textContent = L.attractText;
  document.getElementById('cmpFlowHdr').textContent = L.flowchart;
  document.getElementById('cmpEditorHdr').textContent = L.editorHdr;
  document.getElementById('foot').innerHTML = L.footer;
}

/* ============================ INIT ============================ */
fillText();
renderLegend();
renderOverview();
activity();
</script>
