# Pull-request title check. release-please reads the squash commits on main, and a squash commit is the PR
# title (Settings: squash merging only, "Pull request title" as the commit message), so the title must be a
# conventional commit: `fix: ...` releases a patch, `feat: ...` a minor version, `feat!: ...` a major one;
# `chore:`, `ci:`, `docs:`, `test:`, `refactor:` and the like release nothing.
#
# Its own workflow, so a title edit re-runs this check only, never the 30-minute ci.yml.
name: pr-title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# The token can read the pull request and nothing else.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check that the title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
