# Pull-request title check. release-please reads the squash commits on main, and a squash commit is the PR
# title (Settings: squash merging only, "Pull request title" as the commit message), so the title must be a
# conventional commit: `fix: ...` releases a patch, `feat: ...` a minor version, `feat!: ...` a major one;
# `chore:`, `ci:`, `docs:`, `test:`, `refactor:` and the like release nothing.
#
# Its own workflow, so a title edit re-runs this check only, never the 30-minute ci.yml. The release PR is
# opened with the workflow token, which starts no pull_request run: release-please.yml dispatches this
# workflow on that branch, and the job is then skipped, which a required check is expected to count as passed
# (to be confirmed on the first release PR, see Risks in plans/release-please.md).
name: pr-title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

# The token can read the pull request and nothing else.
permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check that the title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
