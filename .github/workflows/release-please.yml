# The release-please workflow: it decides the next version and hands the release to release.yml.
#
#   job `release-please`:  on every push to main, opens or updates the release PR (version bump and
#                          CHANGELOG.md from the conventional commit titles). When the push IS the merge of
#                          that PR, it creates a DRAFT release with its tag instead (draft and
#                          force-tag-creation in release-please-config.json), so releases/latest never
#                          points at a release without assets.
#   job `release`:         calls release.yml with that tag. release.yml builds, verifies and publishes
#                          exactly as for a pushed tag; it takes release-please's notes over into its own draft.
#   job `ci-on-release-pr`: starts ci.yml and pr-title.yml on the release PR's branch.
#
# Load-bearing choices (do not "simplify" them away):
#   * release.yml is CALLED, not triggered by the tag: a tag created with the workflow token starts no
#     `push: tags` run, and a second trigger would race release-please's draft. One release run per tag.
#   * The release PR is opened with the workflow token, which starts no pull_request run either, so its
#     required checks would never report. workflow_dispatch is the documented exception: ci-on-release-pr
#     dispatches ci.yml and pr-title.yml on the PR branch, whose head is the PR head. The pr-title job is
#     skipped there (it needs a pull request), and a skipped job is expected to count as passed (to be
#     confirmed on the first release PR, see Risks in plans/release-please.md).
#   * The release-please action gets contents and pull-requests, never actions: write; only the job that
#     runs gh alone may dispatch.
#   * One queue, never cancelled: two merges close together update the release PR one after the other. GitHub
#     keeps one running and one pending run per queue, so a THIRD push while one runs cancels the pending one
#     (GitHub docs, "Control the concurrency of workflows and jobs": a new queued run cancels the pending one).
#     release-please works from the state of main and its PR labels, so the next run does what the cancelled
#     one would have. A release it creates that late has its tag on the merge commit while the call builds a
#     later one: release.yml's tag gate refuses that, so the run fails instead of publishing other code under
#     the tag (CONTRIBUTING, "A tag is not on main", says how to release the tagged commit then).
name: release-please

on:
  push:
    branches: [main]

# Nothing by default; every job states what it needs.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the draft release and its tag, the release branch
      pull-requests: write   # the release PR and its labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Update the release PR, or create the draft release and its tag once it was merged
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # release.yml grants it to its release job only; its package job reads
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  ci-on-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch ci.yml and pr-title.yml
    steps:
      - name: Start ci.yml and pr-title.yml on the release PR branch, so its required checks report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<< "$PR_JSON")
          if [ -z "$branch" ]; then
            echo '::error::release-please reported a created or updated PR but no head branch, so its checks could not be started.'
            exit 1
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
          gh workflow run pr-title.yml --repo "$REPO" --ref "$branch"
